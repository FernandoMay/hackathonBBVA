<script>
        function toggleLayer(element) {
            // Remove active classes from all buttons in the same container
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('active-layer');
                btn.classList.add('text-on-surface-variant');
            });
            
            // Add active class to clicked button
            element.classList.add('active-layer');
            element.classList.remove('text-on-surface-variant');
            
            // Interaction feedback
            element.style.transform = 'scale(0.95)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 150);
        }

        // Simulate a pulsing effect for the "current location" on map
        const pulseEffect = document.createElement('div');
        pulseEffect.innerHTML = `
            <div class="absolute top-[45%] left-[60%] w-4 h-4 bg-primary rounded-full z-10 ring-4 ring-primary/30 animate-pulse">
                <div class="absolute -top-10 -left-12 bg-white/90 backdrop-blur-sm px-2 py-1 rounded shadow text-[10px] font-bold text-primary border border-primary/20 whitespace-nowrap">
                    Rancho El Álamo
                </div>
            </div>
        `;
        document.querySelector('[data-location="Mexico"]').appendChild(pulseEffect);
    </script>
